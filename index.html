
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farbansage</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 160px);
            gap: 15px;
            justify-content: center;
            margin: 30px auto;
        }

        button {
            height: 100px;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .rot { background: #e53935; color: white; }
        .gelb { background: #fdd835; color: black; }
        .blau { background: #1e88e5; color: white; }
        .schwarz { background: #000; color: white; border: 1px solid #777; }

        .settings {
            margin: 30px auto;
            max-width: 350px;
        }

        .setting {
            margin: 25px 0;
        }

        .speed-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        input[type="range"] {
            flex: 1;
        }

        input[type="number"] {
            width: 75px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Farbansage</h1>

    <div class="buttons">
        <button class="rot" onclick="sprechen('Rot')">Rot</button>
        <button class="schwarz" onclick="sprechen('Schwarz')">Schwarz</button>
        <button class="gelb" onclick="sprechen('Gelb')">Gelb</button>
        <button class="blau" onclick="sprechen('Blau')">Blau</button>
    </div>

    <script>
		const audioDateien = {
			Rot: new Audio("SFX/Rot.wav"),
			Gelb: new Audio("SFX/Gelb.wav"),
			Blau: new Audio("SFX/Blau.wav"),
			Schwarz: new Audio("SFX/Schwarz.wav")
		};

		function sprechen(farbe) {
			const audio = audioDateien[farbe];

			if (!audio) return;

			// Vorherige Ansage abbrechen
			Object.values(audioDateien).forEach(datei => {
				datei.pause();
				datei.currentTime = 0;
			});

			// Gewählte WAV-Datei abspielen
			audio.play();
		}
    </script>

</body>
</html>
